name: 실거래가 캐시 워밍

# ─────────────────────────────────────────────────────────────
#  api/warm.js 를 반복 호출해서 국토부 실거래를 슈파베이스에 채운다.
#  (전국 24개월 백필이 끝난 뒤에는 '최근 3개월 상시 갱신' 모드로 계속 돈다)
#
#  ⚠️ 2026-10-26 사고 기록 — 한 달간 조용히 멈춰 있었다. 원인이 세 겹이었다.
#   ① api/warm.js 가 100%(9000/9000) 를 찍으면 '전체 워밍 완료'로 즉시 return.
#      그런데 수집 대상 달은 "오늘부터 지난 24개월"이라 달이 바뀌면 밀린다
#      → 10월이 새로 들어왔는데 커서는 9000에 멈춰 아무도 안 채움.
#   ② 이 워크플로가 그 응답의 '"done":true' 를 보고 첫 호출에서 exit 0.
#      그래서 1,136회 실행이 전부 '성공'인데 하나같이 7~8초였다.
#      ⚠️ 초록불이라고 일하고 있는 게 아니다. **실행 시간**을 같이 봐야 한다.
#   ③ GitHub 스케줄러가 '*/20' 을 안 지킨다. 실제론 4시간에 한 번꼴로 돌았다.
#      (공개 레포에서 흔하다. 주기를 못 믿으므로 **한 번 돌 때 많이** 해야 한다)
#
#  그래서 회당 호출을 40 → 150 으로, 간격을 5초 → 3초로 올렸다.
#  한도(DAILY_CALL_CAP)에 닿으면 warm.js 가 'paused' 를 돌려주고 여기서 끊는다.
#  → 하루에 더 돌려봤자 한도가 알아서 막으므로 과하게 긁을 걱정은 없다.
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: warm
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # 정상 회차가 22~23분이라 25분은 너무 빠등했다(닿으면 가짜 빨간불)
    steps:
      - name: 워밍 반복 호출
        run: |
          # ⚠️ 2026-10-27 수정 — exit code 28 (curl 타임아웃) 으로 빨간불이 떴다.
          #    GitHub Actions 의 기본 셸은 `bash -e` 라, curl 이 타임아웃나면
          #    그 자리에서 스텝이 통째로 죽는다. 아래 '빈 응답 처리'는 실행조차 안 됐다.
          #    → `|| RES=""` 로 실패를 삼키고, 연속 실패 5번일 때만 포기한다.
          #    타임아웃도 30초는 짧았다(Vercel 콜드스타트 + 국토부 지연) → 60초.
          SECRET="${{ secrets.WARM_SECRET || '3c4fc034da972bac20f024ef003bf1ec' }}"
          URL="https://a99.co.kr/api/warm?secret=$SECRET"
          OK=0; FAIL=0; STOP=""
          for i in $(seq 1 150); do
            RES=$(curl -s --max-time 60 "$URL") || RES=""
            if [ -z "$RES" ]; then
              FAIL=$((FAIL+1))
              echo "[$i] 응답 없음 (연속 $FAIL 회)"
              if [ "$FAIL" -ge 5 ]; then STOP="연속실패"; break; fi
              sleep 15
              continue
            fi
            FAIL=0
            echo "[$i] $RES"
            case "$RES" in
              *'"paused"'*)  echo "⏸ 오늘 국토부 호출 한도 도달 — 내일 이어서"; STOP="한도도달"; break ;;
              *'"stopped"'*) echo "⚠️ 국토부 API 오류/한도 — 중단";              STOP="API오류";  break ;;
              *'"ok":true'*) OK=$((OK+1)) ;;
              *'"error"'*)   echo "❌ 엔드포인트 오류";                          STOP="엔드포인트오류"; break ;;
            esac
            sleep 3
          done
          echo "─────────────────────────────"
          echo "정상 처리 호출: $OK 회 / 종료사유: ${STOP:-정상완주}"
          # ⚠️ 빨간불은 '진짜 문제'일 때만 띄운다.
          #    한도 도달은 정상이다(첫 호출부터 한도면 OK=0 이어도 문제가 아니다).
          #    그 외에 한 건도 처리 못 했으면 = 조용히 죽은 것 → 빨간불.
          if [ "$OK" -eq 0 ] && [ "$STOP" != "한도도달" ]; then
            echo "❌ 이번 회차에 한 건도 처리하지 못했습니다. (사유: ${STOP:-불명})"
            exit 1
          fi

      - name: 진행 상황 요약
        if: always()
        run: curl -s --max-time 30 "https://a99.co.kr/api/warm?status=1" | sed -e 's/<[^>]*>/ /g' -e 's/  */ /g'
