<!DOCTYPE html>
<html lang="ko">
<head><meta name="robots" content="noindex">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아구구 관리자</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Apple SD Gothic Neo',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh}
.header{background:#1a1f2e;border-bottom:1px solid #2d3748;padding:14px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{font-size:20px;font-weight:900;color:#48bb78}
.login-wrap{max-width:340px;margin:80px auto;padding:32px;background:#1a1f2e;border-radius:12px;border:1px solid #2d3748}
.container{max-width:1100px;margin:0 auto;padding:24px}
.card{background:#1a1f2e;border-radius:12px;border:1px solid #2d3748;padding:24px;margin-bottom:20px}
.card-title{font-size:15px;font-weight:700;margin-bottom:18px;color:#fff;display:flex;align-items:center;gap:8px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;color:#a0aec0;font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.input,.sel{width:100%;padding:9px 12px;background:#2d3748;border:1px solid #4a5568;border-radius:7px;color:#fff;font-size:13px;outline:none;transition:border .2s}
.input:focus,.sel:focus{border-color:#48bb78}
.sel{cursor:pointer;-webkit-appearance:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.btn{padding:9px 18px;border:none;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
.btn-green{background:#48bb78;color:#fff}.btn-green:hover{background:#38a169}
.btn-blue{background:#3182ce;color:#fff}.btn-blue:hover{background:#2b6cb0}
.btn-red{background:#e53e3e;color:#fff}.btn-red:hover{background:#c53030}
.btn-gray{background:#4a5568;color:#fff}.btn-gray:hover{background:#2d3748}
.btn-sm{padding:5px 12px;font-size:11px}
.map-box{width:100%;height:300px;border-radius:8px;border:1px solid #4a5568;margin-bottom:10px}
.coord-display{background:#2d3748;border-radius:6px;padding:8px 12px;font-size:12px;color:#a0aec0;display:flex;align-items:center;gap:8px}
.coord-display span{color:#48bb78;font-weight:600}
.photo-upload{border:2px dashed #4a5568;border-radius:8px;padding:16px;text-align:center;cursor:pointer;transition:.2s}
.photo-upload:hover{border-color:#48bb78;background:#1e2533}
.photo-preview-wrap{display:flex;align-items:center;gap:12px;margin-top:10px}
.photo-circle{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #48bb78}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:#718096;font-weight:600;padding:8px 12px;border-bottom:1px solid #2d3748;text-align:left;white-space:nowrap}
td{padding:10px 12px;font-size:13px;border-bottom:1px solid #1e2533;vertical-align:middle}
tr:hover td{background:#1a2030}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.badge-on{background:#276749;color:#9ae6b4}
.badge-off{background:#742a2a;color:#feb2b2}
.badge-exp{background:#7b341e;color:#fbd38d}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid #4a5568}
.avatar-ph{width:34px;height:34px;border-radius:50%;background:#2d3748;display:flex;align-items:center;justify-content:center;font-size:16px}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none}
.toast.show{opacity:1}
.edit-mode{border-color:#3182ce !important;box-shadow:0 0 0 2px rgba(49,130,206,.3)}
.search-wrap{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.search-input{flex:1;padding:9px 12px;background:#2d3748;border:1px solid #4a5568;border-radius:7px;color:#fff;font-size:13px;outline:none}
.search-input:focus{border-color:#48bb78}
.tabs{display:flex;gap:0;border:1px solid #2d3748;border-radius:8px;overflow:hidden;margin-bottom:20px}
.tab{flex:1;padding:12px;text-align:center;font-size:14px;font-weight:600;cursor:pointer;background:#1a1f2e;color:#718096;transition:.15s;border-right:1px solid #2d3748}
.tab:last-child{border-right:none}
.tab.active{background:#48bb78;color:#fff}
.tab:hover:not(.active){background:#2d3748}
.area-chip{display:inline-flex;align-items:center;gap:4px;background:#2d3748;border:1px solid #4a5568;border-radius:16px;padding:4px 10px;font-size:11px;color:#e2e8f0;margin:3px}
.area-chip .x{cursor:pointer;color:#fc8181;font-weight:700;margin-left:2px}
.apt-tag{display:inline-flex;align-items:center;gap:5px;background:#276749;border:1px solid #38a169;border-radius:16px;padding:4px 10px;font-size:11px;color:#9ae6b4;margin:3px}
.apt-tag .x{cursor:pointer;color:#fc8181;font-weight:700}
.apt-tab-wrap{display:flex;border:1px solid #4a5568;border-radius:7px;overflow:hidden;margin-bottom:10px}
.apt-tab{flex:1;padding:8px;background:#2d3748;color:#a0aec0;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
.apt-tab.active{background:#48bb78;color:#fff}
.apt-tab:hover:not(.active){background:#3d4a5c}
.apt-panel{margin-bottom:4px}
.apt-list-item{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;font-size:13px;border-bottom:1px solid #3d4a5c;color:#e2e8f0}
.apt-list-item:hover{background:#2d3748}
.apt-list-item small{color:#718096;font-size:11px;margin-left:6px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apt-add-btn{flex-shrink:0;padding:4px 10px;background:#276749;color:#9ae6b4;border:none;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer}
.apt-add-btn:hover{background:#38a169}
.banner-preview{width:100%;max-height:80px;object-fit:cover;border-radius:6px;border:1px solid #4a5568}
.section{display:none}
.section.active{display:block}
</style>
</head>
<body>

<div id="login-page">
  <div style="text-align:center;padding:48px 0 0">
    <div style="font-size:32px;font-weight:900;color:#48bb78">아구구</div>
    <div style="font-size:12px;color:#718096;margin-top:4px">관리자 페이지</div>
  </div>
  <div class="login-wrap">
    <div style="font-size:18px;font-weight:700;margin-bottom:20px;text-align:center">🔐 로그인</div>
    <div class="field">
      <label>비밀번호</label>
      <input class="input" type="password" id="pw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-green" style="width:100%;padding:11px" onclick="doLogin()">로그인</button>
    <div id="login-err" style="color:#fc8181;font-size:12px;margin-top:8px;text-align:center"></div>
  </div>
</div>

<div id="main-page" style="display:none">
  <div class="header">
    <div class="logo">아구구</div>
    <span style="font-size:15px;font-weight:700">관리자</span>
    <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
      <a href="https://guhaedo.kr" target="_blank" style="color:#48bb78;font-size:12px;text-decoration:none">사이트 →</a>
      <button class="btn btn-gray btn-sm" onclick="logout()">로그아웃</button>
    </div>
  </div>

  <div class="container">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('broker')">🏠 중개사</div>
      <div class="tab" onclick="switchTab('biz')">🏢 업체</div>
      <div class="tab" onclick="switchTab('banner')">📢 배너</div>
    </div>

    <!-- ==================== 중개사 탭 ==================== -->
    <div class="section active" id="sec-broker">
      <div class="card" id="broker-form-card">
        <div class="card-title">
          <span id="broker-form-title">➕ 중개사 등록</span>
          <span id="broker-edit-badge" style="display:none" class="badge badge-on">수정 중</span>
          <div style="margin-left:auto"><button class="btn btn-gray btn-sm" id="broker-cancel-btn" style="display:none" onclick="brokerCancel()">취소</button></div>
        </div>
        <div class="field">
          <label>📍 지도 클릭으로 위치 지정</label>
          <div class="map-box" id="broker-map"></div>
          <div class="coord-display">위도 <span id="broker-lat">-</span> / 경도 <span id="broker-lng">-</span></div>
        </div>
        <div class="grid2">
          <div class="field"><label>사무소명 *</label><input class="input" id="b-name" placeholder="사무소 이름"></div>
          <div class="field"><label>연락처</label><input class="input" id="b-phone" placeholder="010-0000-0000"></div>
        </div>
        <div class="field"><label>주소</label><input class="input" id="b-addr" placeholder="도로명 주소"></div>
        <div class="grid3">
          <div class="field"><label>가입 시작일</label><input class="input" type="date" id="b-start"></div>
          <div class="field"><label>만료일</label><input class="input" type="date" id="b-expires"></div>
          <div class="field"><label>메모</label><input class="input" id="b-memo" placeholder="내부 메모"></div>
        </div>
        <div class="field">
          <label>프로필 사진</label>
          <div class="photo-upload" onclick="document.getElementById('b-photo-file').click()">
            <input type="file" id="b-photo-file" accept="image/*" style="display:none" onchange="previewImg(this,'b')">
            <div id="b-photo-text"><div style="font-size:22px">📷</div><div style="font-size:13px;color:#a0aec0">클릭해서 사진 선택</div></div>
          </div>
          <div class="photo-preview-wrap" id="b-photo-wrap" style="display:none">
            <img id="b-photo-preview" class="photo-circle">
            <div><div style="font-size:13px;font-weight:600" id="b-photo-name"></div>
            <button class="btn btn-gray btn-sm" style="margin-top:4px" onclick="clearImg('b')">제거</button></div>
          </div>
        </div>
        <!-- 담당 단지 -->
        <div class="field">
          <label>📌 담당 단지 (전문중개사 표시)</label>
          <!-- 탭 -->
          <div class="apt-tab-wrap">
            <button class="apt-tab active" id="apt-tab-sido" onclick="switchAptTab('sido')">소재지 선택</button>
            <button class="apt-tab" id="apt-tab-name" onclick="switchAptTab('name')">단지명 검색</button>
          </div>
          <!-- 소재지 탭 -->
          <div id="apt-panel-sido" class="apt-panel">
            <div class="grid3" style="gap:8px;margin-bottom:8px">
              <select class="sel" id="b-sido" onchange="aptSidoChange()"><option value="">시도</option></select>
              <select class="sel" id="b-sigungu" onchange="aptSigunguChange()"><option value="">시군구</option></select>
              <select class="sel" id="b-emd" onchange="aptEmdChange()"><option value="">읍면동</option></select>
            </div>
            <div id="b-apt-sido-list" style="max-height:180px;overflow-y:auto;border:1px solid #4a5568;border-radius:6px;display:none"></div>
          </div>
          <!-- 단지명 탭 -->
          <div id="apt-panel-name" class="apt-panel" style="display:none">
            <div style="display:flex;gap:8px">
              <input class="input" id="b-apt-search" placeholder="단지명 입력 후 검색..." autocomplete="off" style="flex:1" onkeydown="if(event.key==='Enter')doAptSearch()">
              <button class="btn btn-green btn-sm" onclick="doAptSearch()">검색</button>
            </div>
            <div id="b-apt-name-list" style="max-height:180px;overflow-y:auto;border:1px solid #4a5568;border-radius:6px;margin-top:8px;display:none"></div>
          </div>
          <!-- 추가된 단지 태그 -->
          <div id="b-apt-tags" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:24px"></div>
        </div>
        <button class="btn btn-green" id="broker-submit" onclick="brokerSubmit()">✅ 등록하기</button>
      </div>
      <div class="card">
        <div class="card-title">👥 등록된 중개사 <span id="broker-count" style="font-size:13px;color:#718096;font-weight:400"></span></div>
        <div class="search-wrap">
          <input class="search-input" id="broker-search" placeholder="🔍 검색" oninput="filterList('broker')">
        </div>
        <div class="table-wrap" id="broker-list"></div>
      </div>
    </div>

    <!-- ==================== 업체 탭 ==================== -->
    <div class="section" id="sec-biz">
      <div class="card" id="biz-form-card">
        <div class="card-title">
          <span id="biz-form-title">➕ 업체 등록</span>
          <span id="biz-edit-badge" style="display:none" class="badge badge-on">수정 중</span>
          <div style="margin-left:auto"><button class="btn btn-gray btn-sm" id="biz-cancel-btn" style="display:none" onclick="bizCancel()">취소</button></div>
        </div>
        <div class="field">
          <label>📍 지도 클릭으로 위치 지정</label>
          <div class="map-box" id="biz-map"></div>
          <div class="coord-display">위도 <span id="biz-lat">-</span> / 경도 <span id="biz-lng">-</span></div>
        </div>
        <div class="grid2">
          <div class="field"><label>업체명 *</label><input class="input" id="z-name" placeholder="업체 이름"></div>
          <div class="field"><label>업종 *</label>
            <select class="sel" id="z-category">
              <option value="">선택</option>
              <option>법무사</option><option>세무사</option><option>이사업체</option>
              <option>청소업체</option><option>수리업체</option><option>기타</option>
            </select>
          </div>
        </div>
        <div class="grid2">
          <div class="field"><label>연락처</label><input class="input" id="z-phone" placeholder="010-0000-0000"></div>
          <div class="field"><label>주소</label><input class="input" id="z-addr" placeholder="도로명 주소"></div>
        </div>
        <div class="grid3">
          <div class="field"><label>가입 시작일</label><input class="input" type="date" id="z-start"></div>
          <div class="field"><label>만료일</label><input class="input" type="date" id="z-expires"></div>
          <div class="field"><label>메모</label><input class="input" id="z-memo" placeholder="내부 메모"></div>
        </div>
        <div class="field">
          <label>프로필 사진</label>
          <div class="photo-upload" onclick="document.getElementById('z-photo-file').click()">
            <input type="file" id="z-photo-file" accept="image/*" style="display:none" onchange="previewImg(this,'z')">
            <div id="z-photo-text"><div style="font-size:22px">📷</div><div style="font-size:13px;color:#a0aec0">클릭해서 사진 선택</div></div>
          </div>
          <div class="photo-preview-wrap" id="z-photo-wrap" style="display:none">
            <img id="z-photo-preview" class="photo-circle">
            <div><div style="font-size:13px;font-weight:600" id="z-photo-name"></div>
            <button class="btn btn-gray btn-sm" style="margin-top:4px" onclick="clearImg('z')">제거</button></div>
          </div>
        </div>
        <button class="btn btn-green" id="biz-submit" onclick="bizSubmit()">✅ 등록하기</button>
      </div>
      <div class="card">
        <div class="card-title">🏢 등록된 업체 <span id="biz-count" style="font-size:13px;color:#718096;font-weight:400"></span></div>
        <div class="search-wrap">
          <input class="search-input" id="biz-search" placeholder="🔍 검색" oninput="filterList('biz')">
        </div>
        <div class="table-wrap" id="biz-list"></div>
      </div>
    </div>

    <!-- ==================== 배너 탭 ==================== -->
    <div class="section" id="sec-banner">
      <!-- 배너 지역 검색 카드 -->
      <div class="card">
        <div class="card-title">📍 배너 등록 지역</div>
        <div class="grid3" style="margin-bottom:12px">
          <select class="sel" id="bn-sido" onchange="bnSidoChange()"><option value="">시도</option></select>
          <select class="sel" id="bn-sigungu" onchange="bnSigunguChange()"><option value="">시군구</option></select>
          <select class="sel" id="bn-emd" onchange="bnEmdChange()"><option value="">읍면동</option></select>
        </div>
        <div id="bn-area-result" style="display:none"></div>
      </div>
      <!-- 배너 목록 카드 -->
      <div class="card">
        <div class="card-title">📢 등록된 배너 <span id="banner-count" style="font-size:13px;color:#718096;font-weight:400"></span></div>
        <div id="banner-list"></div>
      </div>

      <!-- 배너 등록/수정 모달 -->
      <div id="bn-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;align-items:center;justify-content:center">
        <div style="background:#1e2533;border-radius:12px;padding:28px;width:min(520px,94vw);max-height:90vh;overflow-y:auto;position:relative">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
            <span id="bn-modal-title" style="font-size:16px;font-weight:700">배너 등록</span>
            <button onclick="closeBnModal()" style="background:none;border:none;color:#a0aec0;font-size:20px;cursor:pointer">✕</button>
          </div>
          <div id="bn-modal-area-badge" style="background:#2d3748;border-radius:6px;padding:6px 12px;font-size:12px;color:#a0aec0;margin-bottom:16px"></div>
          <div class="field"><label>업체명 *</label><input class="input" id="bn-name" placeholder="업체명 입력"></div>
          <div class="field"><label>업종</label>
            <select class="sel" id="bn-category-sel" onchange="bnCatSelChange()">
              <option value="">선택</option>
              <option>법무사</option><option>세무사</option><option>이사업체</option>
              <option>청소업체</option><option>수리업체</option><option>인테리어</option>
              <option>대출상담</option><option>도배장판</option><option>학원</option>
              <option value="__direct__">직접 입력</option>
            </select>
            <input class="input" id="bn-category-direct" placeholder="업종 직접 입력" style="display:none;margin-top:6px">
          </div>
          <div class="grid2">
            <div class="field"><label>연락처</label><input class="input" id="bn-phone" placeholder="010-0000-0000"></div>
            <div class="field"><label>만료일</label><input class="input" type="date" id="bn-expires"></div>
          </div>
          <div class="field">
            <label>배너 이미지 *</label>
            <div class="photo-upload" onclick="document.getElementById('bn-img-file').click()">
              <input type="file" id="bn-img-file" accept="image/*,image/svg+xml" style="display:none" onchange="previewBanner(this)">
              <div id="bn-img-text"><div style="font-size:22px">🖼️</div><div style="font-size:13px;color:#a0aec0">클릭해서 배너 이미지 선택</div><div style="font-size:11px;color:#718096">가로형 권장 · PNG/JPG/SVG</div></div>
            </div>
            <div id="bn-img-wrap" style="display:none;margin-top:10px">
              <img id="bn-img-preview" class="banner-preview" style="width:100%;border-radius:6px">
              <button class="btn btn-gray btn-sm" style="margin-top:6px" onclick="clearBannerImg()">이미지 제거</button>
            </div>
          </div>
          <div style="display:flex;gap:8px;margin-top:8px">
            <button class="btn btn-gray" style="flex:1" onclick="closeBnModal()">취소</button>
            <button class="btn btn-green" style="flex:2" id="bn-modal-submit" onclick="bannerSubmit()">✅ 등록하기</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=a7a67059ffadc0b7c6e4318639cdedeb&autoload=false"></script>

// ===== 공통 변수 =====

// ===== 로그인 =====
function doLogin(){
  if(document.getElementById('pw').value===ADMIN_PW){
    document.getElementById('login-page').style.display='none';
    document.getElementById('main-page').style.display='block';
    initMaps();loadAll();
  }else{document.getElementById('login-err').textContent='비밀번호가 틀렸습니다.';}
}
function logout(){
  document.getElementById('login-page').style.display='block';
  document.getElementById('main-page').style.display='none';
}

// ===== 탭 =====
function switchTab(name){
  document.querySelectorAll('.tab').forEach(function(t,i){t.classList.toggle('active',['broker','biz','banner'][i]===name);});
  document.querySelectorAll('.section').forEach(function(s){s.classList.remove('active');});
  document.getElementById('sec-'+name).classList.add('active');
  if(name==='broker'&&brokerMap)brokerMap.relayout();
  if(name==='biz'&&bizMap)bizMap.relayout();
}

// ===== 지도 초기화 =====
function initMaps(){
  kakao.maps.load(function(){
    var center=new kakao.maps.LatLng(36.7782,127.0952);
    brokerMap=new kakao.maps.Map(document.getElementById('broker-map'),{center:center,level:7});
    kakao.maps.event.addListener(brokerMap,'click',function(e){
      brokerLat=e.latLng.getLat();brokerLng=e.latLng.getLng();
      document.getElementById('broker-lat').textContent=brokerLat.toFixed(6);
      document.getElementById('broker-lng').textContent=brokerLng.toFixed(6);
      if(brokerMarker)brokerMarker.setMap(null);
      brokerMarker=new kakao.maps.Marker({position:e.latLng,map:brokerMap});
    });
    bizMap=new kakao.maps.Map(document.getElementById('biz-map'),{center:center,level:7});
    kakao.maps.event.addListener(bizMap,'click',function(e){
      bizLat=e.latLng.getLat();bizLng=e.latLng.getLng();
      document.getElementById('biz-lat').textContent=bizLat.toFixed(6);
      document.getElementById('biz-lng').textContent=bizLng.toFixed(6);
      if(bizMarker)bizMarker.setMap(null);
      bizMarker=new kakao.maps.Marker({position:e.latLng,map:bizMap});
    });
  });
}

// ===== 공통 함수 =====
function ge(id){return document.getElementById(id);}
function gv(id){var el=ge(id);return el?el.value.trim():'';}
function toast(msg,err){var t=ge('toast');t.textContent=msg;t.style.background=err?'#742a2a':'#276749';t.style.color=err?'#feb2b2':'#9ae6b4';t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}

function previewImg(input,prefix){
  var file=input.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(e){
    if(prefix==='b')brokerPhoto=e.target.result;else bizPhoto=e.target.result;
    ge(prefix+'-photo-preview').src=e.target.result;
    ge(prefix+'-photo-name').textContent=file.name;
    ge(prefix+'-photo-text').style.display='none';
    ge(prefix+'-photo-wrap').style.display='flex';
  };r.readAsDataURL(file);
}
function clearImg(prefix){
  if(prefix==='b')brokerPhoto=null;else bizPhoto=null;
  ge(prefix+'-photo-file').value='';
  ge(prefix+'-photo-text').style.display='block';
  ge(prefix+'-photo-wrap').style.display='none';
}
function previewBanner(input){
  var file=input.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(e){bannerImg=e.target.result;ge('bn-img-preview').src=e.target.result;ge('bn-img-text').style.display='none';ge('bn-img-wrap').style.display='block';};
  r.readAsDataURL(file);
}
function clearBannerImg(){bannerImg=null;ge('bn-img-file').value='';ge('bn-img-text').style.display='block';ge('bn-img-wrap').style.display='none';}

function statusBadge(d){
  var today=new Date().toISOString().split('T')[0];
  var expired=d.expires_at&&d.expires_at<today;
  return !d.active?'<span class="badge badge-off">비활성</span>':expired?'<span class="badge badge-exp">만료</span>':'<span class="badge badge-on">활성</span>';
}
function expLabel(d){
  var today=new Date().toISOString().split('T')[0];
  if(!d.expires_at)return '<span style="color:#48bb78;font-size:11px">무제한</span>';
  var expired=d.expires_at<today;
  return '<span style="font-size:12px;color:'+(expired?'#fc8181':'#a0aec0')+'">'+d.expires_at+'</span>';
}

// ===== 데이터 로드 =====
function loadAll(){
  ge('b-start').value=new Date().toISOString().split('T')[0];
  ge('z-start').value=new Date().toISOString().split('T')[0];
  loadBrokers();loadBiz();loadBanners();loadAreaData();
}

async function loadBrokers(){
  var r=await fetch(SUPABASE_URL+'/rest/v1/brokers?select=*&order=created_at.desc',{headers:hdrs});
  allBrokers=await r.json();ge('broker-count').textContent='('+allBrokers.length+'명)';renderBrokers(allBrokers);
}
async function loadBiz(){
  try{var r=await fetch(SUPABASE_URL+'/rest/v1/businesses?select=*&order=created_at.desc',{headers:hdrs});allBiz=await r.json();}catch(e){allBiz=[];}
  ge('biz-count').textContent='('+allBiz.length+'곳)';renderBiz(allBiz);
}
async function loadBanners(){
  try{var r=await fetch(SUPABASE_URL+'/rest/v1/banners?select=*&order=created_at.desc',{headers:hdrs});allBanners=await r.json();}catch(e){allBanners=[];}
  ge('banner-count').textContent='('+allBanners.length+'개)';renderBanners(allBanners);
  // localStorage에도 저장 (메인사이트 인쇄용)
  try{localStorage.setItem('adBannersData',JSON.stringify(allBanners.filter(function(b){return b.active;})));}catch(e){}
}
async function loadAreaData(){
  try{
    var r1=await fetch('/split_output/coords_sigungu.json');
    var sgArr=await r1.json();
    var sidoSet={};
    sgArr.forEach(function(s){
      sidoSet[s.sido]=1;
      if(!areaData.sigunguMap[s.sido])areaData.sigunguMap[s.sido]=[];
      areaData.sigunguMap[s.sido].push(s.name);
    });
    areaData.sidos=Object.keys(sidoSet).sort();
    initAptSidoSelect();
    var r2=await fetch('/split_output/coords_dong.json');
    var dongArr=await r2.json();
    dongArr.forEach(function(d){
      var key=d.sido+'|'+d.sigungu;
      if(!areaData.emdMap[key])areaData.emdMap[key]=[];
      areaData.emdMap[key].push(d.name);
    });
    // 시도 셀렉트 채우기
    var sel=ge('bn-sido');
    sel.innerHTML='<option value="">시도</option>'+areaData.sidos.map(function(s){return '<option>'+s+'</option>';}).join('');
  }catch(e){console.log('지역 데이터 로드 실패:',e);}
}

const BANNER_MAX = 6;
let bnCurrentArea = null; // {sido, sigungu, emd}

async function bnEmdChange(){
  var sido=gv('bn-sido'),sg=gv('bn-sigungu'),emd=gv('bn-emd');
  var res=ge('bn-area-result');
  if(!emd){res.style.display='none';return;}
  bnCurrentArea={sido:sido,sigungu:sg,emd:emd};
  res.style.display='block';
  res.innerHTML='<div style="font-size:12px;color:#718096;padding:8px 0">조회 중...</div>';
  try{
    var today=new Date().toISOString().split('T')[0];
    var rows=await fetch(SUPABASE_URL+'/rest/v1/banners?select=id,business_name,category,phone,expires_at,active,areas,image&active=eq.true',{headers:hdrs}).then(function(r){return r.json();});
    var matched=rows.filter(function(b){
      if(b.expires_at&&b.expires_at<today)return false;
      return Array.isArray(b.areas)&&b.areas.some(function(a){return a.sido===sido&&a.sigungu===sg&&a.emd===emd;});
    });
    var cnt=matched.length;
    var isFull=cnt>=BANNER_MAX;
    var html='<div style="border-bottom:1px solid #2d3748;padding-bottom:12px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">'
      +'<span style="font-size:13px;font-weight:700;color:#e2e8f0">'+sido+' '+sg+' '+emd
        +'<span style="font-size:11px;font-weight:400;color:'+(isFull?'#fc8181':'#68d391')+';margin-left:8px">'+(isFull?'마감':'잔여 '+(BANNER_MAX-cnt)+'자리')+' ('+cnt+'/'+BANNER_MAX+')</span>'
      +'</span>'
      +(isFull?'':'<button onclick="openBnModal()" class="btn btn-green btn-sm">+ 가입자 추가</button>')
    +'</div>';
    if(cnt===0){
      html+='<div style="font-size:12px;color:#718096;padding:16px 0;text-align:center">이 지역 등록된 배너가 없습니다</div>';
    }else{
      html+='<div style="display:flex;flex-direction:column;gap:14px">'
        +matched.map(function(b){
          var imgHtml=b.image
            ?'<img src="'+b.image+'" style="width:100%;max-height:90px;object-fit:cover;border-radius:6px;margin-bottom:8px">'
            :'<div style="width:100%;height:52px;background:#2d3748;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#718096;font-size:11px;margin-bottom:8px">이미지 없음</div>';
          return '<div style="background:#1a202c;border-radius:8px;padding:12px;border:1px solid #2d3748">'
            +imgHtml
            +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px">'
              +'<div>'
                +'<div style="font-size:13px;font-weight:700;color:#e2e8f0">'+b.business_name+'</div>'
                +'<div style="font-size:11px;color:#a0aec0;margin-top:2px">'+(b.category||'업종 미입력')+(b.phone?' · '+b.phone:'')+'</div>'
              +'</div>'
              +'<div style="text-align:right;flex-shrink:0">'
                +statusBadge(b)
                +'<div style="font-size:11px;color:#718096;margin-top:3px">'+(b.expires_at?'~'+b.expires_at:'무제한')+'</div>'
              +'</div>'
            +'</div>'
            +'<div style="display:flex;gap:6px">'
              +'<button class="btn btn-blue btn-sm" style="flex:1" onclick="bannerEdit(\''+b.id+'\')">수정</button>'
              +'<button class="btn btn-gray btn-sm" style="flex:1" onclick="bannerToggle(\''+b.id+'\','+b.active+')">'+(b.active?'비활성':'활성')+'</button>'
              +'<button class="btn btn-red btn-sm" style="flex:1" onclick="bannerDeleteArea(\''+b.id+'\',\''+b.business_name+'\')">삭제</button>'
            +'</div>'
          +'</div>';
        }).join('')
      +'</div>';
    }
    res.innerHTML=html;
  }catch(e){res.innerHTML='<span style="color:#fc8181;font-size:12px">조회 실패</span>';}
}

  ge('bn-modal-submit').textContent=editId?'✅ 수정하기':'✅ 등록하기';

    // 신규: 현재 선택된 지역 표시, 폼 초기화
    ge('bn-modal-area-badge').textContent=bnCurrentArea?bnCurrentArea.sido+' '+bnCurrentArea.sigungu+' '+bnCurrentArea.emd:'지역 미선택';

// ===== 검색 =====
function filterList(type){
  var q=ge(type+'-search').value.trim().toLowerCase();
  if(type==='broker'){renderBrokers(q?allBrokers.filter(function(d){return (d.name||'').toLowerCase().includes(q)||(d.addr||'').toLowerCase().includes(q)||(d.phone||'').includes(q);}):allBrokers);}
  else{renderBiz(q?allBiz.filter(function(d){return (d.name||'').toLowerCase().includes(q)||(d.category||'').includes(q)||(d.phone||'').includes(q);}):allBiz);}
}

// ===== 중개사 렌더/CRUD =====
function renderBrokers(data){
  var el=ge('broker-list');
  if(!data.length){el.innerHTML='<div style="text-align:center;padding:32px;color:#718096">등록된 중개사가 없습니다</div>';return;}
  el.innerHTML='<table><tr><th>사진</th><th>사무소명</th><th>연락처</th><th>주소</th><th>만료일</th><th>상태</th><th>관리</th></tr>'+
    data.map(function(d){
      var av=d.photo?'<img class="avatar" src="'+d.photo+'">':'<div class="avatar-ph">🏠</div>';
      return '<tr><td>'+av+'</td>'
        +'<td style="font-weight:600">'+d.name+(d.memo?'<div style="font-size:11px;color:#718096">'+d.memo+'</div>':'')+'</td>'
        +'<td style="color:#a0aec0">'+(d.phone||'-')+'</td>'
        +'<td style="color:#a0aec0;font-size:12px;max-width:160px">'+(d.addr||'-')+'</td>'
        +'<td>'+expLabel(d)+'</td>'
        +'<td>'+statusBadge(d)+'</td>'
        +'<td><div style="display:flex;gap:5px;flex-wrap:wrap">'
          +'<button class="btn btn-blue btn-sm" onclick="brokerEdit(\''+d.id+'\')">수정</button>'
          +'<button class="btn btn-gray btn-sm" onclick="brokerToggle(\''+d.id+'\','+d.active+')">'+(d.active?'비활성':'활성')+'</button>'
          +'<button class="btn btn-red btn-sm" onclick="brokerDelete(\''+d.id+'\',\''+d.name+'\')">삭제</button>'
          +'<button class="btn btn-sm" style="background:#2d3748;color:#e2e8f0" onclick="toggleBrokerApts(\''+d.id+'\',this)">단지 ▼</button>'
        +'</div></td></tr>'
        +'<tr id="broker-apts-row-'+d.id+'" style="display:none"><td colspan="7" style="padding:0"><div id="broker-apts-'+d.id+'" style="padding:8px 16px;background:#1a202c;border-bottom:1px solid #2d3748;font-size:12px;color:#a0aec0">불러오는 중...</div></td></tr>';
    }).join('')+'</table>';
}
async function toggleBrokerApts(brokerId, btn){
  var row=ge('broker-apts-row-'+brokerId);
  var box=ge('broker-apts-'+brokerId);
  if(!row)return;
  var isOpen=row.style.display!=='none';
  if(isOpen){row.style.display='none';btn.textContent='단지 ▼';return;}
  row.style.display='';btn.textContent='단지 ▲';
  if(box.dataset.loaded){return;} // 이미 로드됨
  try{
    var today=new Date().toISOString().split('T')[0];
    var rows=await fetch(SUPABASE_URL+'/rest/v1/broker_apts?broker_id=eq.'+brokerId+'&select=apt_name,kapt_code,start_date,expires_at,active&order=start_date.desc',{headers:hdrs}).then(function(r){return r.json();});
    if(!Array.isArray(rows)||!rows.length){box.innerHTML='<span style="color:#718096">등록된 단지 없음</span>';box.dataset.loaded='1';return;}
    box.innerHTML='<div style="display:flex;flex-wrap:wrap;gap:6px;padding:4px 0">'+rows.map(function(r){
      var expired=r.expires_at&&r.expires_at<today;
      var color=!r.active?'#718096':expired?'#e53e3e':'#38a169';
      var status=!r.active?'비활성':expired?'만료':'활성';
      return '<span style="background:#2d3748;border-radius:6px;padding:4px 10px;font-size:11px;border:1px solid #4a5568">'
        +'<span style="color:#e2e8f0;font-weight:600">'+(r.apt_name||r.kapt_code)+'</span>'
        +(r.expires_at?'<span style="color:#718096;margin-left:4px">~'+r.expires_at+'</span>':'')
        +'<span style="margin-left:6px;color:'+color+'">'+status+'</span>'
        +'</span>';
    }).join('')+'</div>';
    box.dataset.loaded='1';
  }catch(e){box.innerHTML='<span style="color:#e53e3e">불러오기 실패</span>';}
}

function brokerCancel(){
  brokerEditId=null;brokerPhoto=null;clearImg('b');
  ge('broker-form-title').textContent='➕ 중개사 등록';
  ge('broker-edit-badge').style.display='none';
  ge('broker-submit').textContent='✅ 등록하기';ge('broker-submit').className='btn btn-green';
  ge('broker-cancel-btn').style.display='none';
  ge('broker-form-card').classList.remove('edit-mode');
  ['b-name','b-phone','b-addr','b-expires','b-memo'].forEach(function(id){ge(id).value='';});
  if(brokerMarker){brokerMarker.setMap(null);brokerMarker=null;}
  brokerLat=null;brokerLng=null;ge('broker-lat').textContent='-';ge('broker-lng').textContent='-';
  specialistApts=[];renderAptTags();ge('b-apt-search').value='';ge('b-apt-dropdown').style.display='none';
}
function brokerEdit(id){
  var d=allBrokers.find(function(b){return b.id===id;});if(!d)return;
  brokerEditId=id;
  ge('broker-form-card').scrollIntoView({behavior:'smooth'});
  ge('broker-form-title').textContent='✏️ 중개사 수정';
  ge('broker-edit-badge').style.display='inline-block';
  ge('broker-submit').textContent='💾 저장하기';ge('broker-submit').className='btn btn-blue';
  ge('broker-cancel-btn').style.display='inline-block';
  ge('broker-form-card').classList.add('edit-mode');
  ge('b-name').value=d.name||'';ge('b-phone').value=d.phone||'';ge('b-addr').value=d.addr||'';
  ge('b-expires').value=d.expires_at||'';ge('b-memo').value=d.memo||'';
  if(d.lat&&d.lng&&brokerMap){
    var pos=new kakao.maps.LatLng(d.lat,d.lng);brokerMap.setCenter(pos);brokerMap.setLevel(5);
    if(brokerMarker)brokerMarker.setMap(null);
    brokerMarker=new kakao.maps.Marker({position:pos,map:brokerMap});
    brokerLat=d.lat;brokerLng=d.lng;ge('broker-lat').textContent=d.lat.toFixed(6);ge('broker-lng').textContent=d.lng.toFixed(6);
  }
  if(d.photo){brokerPhoto=d.photo;ge('b-photo-preview').src=d.photo;ge('b-photo-name').textContent='기존 사진';ge('b-photo-text').style.display='none';ge('b-photo-wrap').style.display='flex';}else{clearImg('b');}
  specialistApts=[];
  renderAptTags();
  // broker_apts 테이블에서 기존 담당 단지 불러오기
  fetch(SUPABASE_URL+'/rest/v1/broker_apts?broker_id=eq.'+id+'&select=kapt_code,apt_name,start_date,expires_at,active',{headers:hdrs})
    .then(function(r){return r.json();})
    .then(function(rows){
      if(Array.isArray(rows)){
        specialistApts=rows.map(function(row){return {kapt_code:row.kapt_code,name:row.apt_name||row.kapt_code,addr:'',start_date:row.start_date,expires_at:row.expires_at,active:row.active};});
        renderAptTags();
      }
    });
}
async function brokerSubmit(){
  var name=gv('b-name');if(!name){toast('사무소명을 입력하세요',true);return;}
  if(!brokerLat){toast('지도에서 위치를 선택하세요',true);return;}
  var body={name:name,phone:gv('b-phone'),addr:gv('b-addr'),lat:brokerLat,lng:brokerLng,photo:brokerPhoto||null,expires_at:gv('b-expires')||null,memo:gv('b-memo'),active:true};
  var brokerId=brokerEditId;
  if(brokerEditId){
    var r=await fetch(SUPABASE_URL+'/rest/v1/brokers?id=eq.'+brokerEditId,{method:'PATCH',headers:Object.assign({},hdrs,{'Prefer':'return=minimal'}),body:JSON.stringify(body)});
    if(!r.ok){toast('실패',true);return;}
  }else{
    var rh=Object.assign({},hdrs,{'Prefer':'return=representation'});
    var r=await fetch(SUPABASE_URL+'/rest/v1/brokers',{method:'POST',headers:rh,body:JSON.stringify(body)});
    if(!r.ok){toast('실패',true);return;}
    var created=await r.json();
    brokerId=Array.isArray(created)?created[0].id:created.id;
  }
  // broker_apts 동기화: 기존 전체 삭제 후 재삽입
  if(brokerId){
    await fetch(SUPABASE_URL+'/rest/v1/broker_apts?broker_id=eq.'+brokerId,{method:'DELETE',headers:hdrs});
    if(specialistApts.length){
      var today=new Date().toISOString().split('T')[0];
      var aptRows=specialistApts.map(function(a){
        return {broker_id:brokerId,kapt_code:a.kapt_code,apt_name:a.name,start_date:a.start_date||today,expires_at:a.expires_at||null,active:true};
      });
      await fetch(SUPABASE_URL+'/rest/v1/broker_apts',{method:'POST',headers:Object.assign({},hdrs,{'Prefer':'return=minimal'}),body:JSON.stringify(aptRows)});
    }
  }
  toast(brokerEditId?'수정 완료!':'등록 완료!');brokerCancel();loadBrokers();
}

let sigunguAptCache={};
async function loadAptsBySigungu(sido,sg,emd){
  var el=ge('b-apt-sido-list');
  el.style.display='block';
  el.innerHTML='<div style="padding:12px;font-size:12px;color:#718096">불러오는 중...</div>';
  // coords_sigungu.json에서 코드 찾기
  var sgCode='';
  try{
    var r=await fetch('/split_output/coords_sigungu.json');
    var sgArr=await r.json();
    var found=sgArr.find(function(s){return s.sido===sido&&s.name===sg;});
    if(found)sgCode=found.code;
  }catch(e){}
  if(!sgCode){el.innerHTML='<div style="padding:12px;font-size:12px;color:#fc8181">시군구 코드를 찾을 수 없습니다</div>';return;}
  var apts;
  if(sigunguAptCache[sgCode]){
    apts=sigunguAptCache[sgCode];
  }else{
    try{
      var r2=await fetch('/split_output/coords_apt_'+sgCode+'.json');
      apts=await r2.json();
      sigunguAptCache[sgCode]=apts;
    }catch(e){el.innerHTML='<div style="padding:12px;font-size:12px;color:#fc8181">단지 데이터 없음</div>';return;}
  }
  var filtered=emd?apts.filter(function(a){return a.emd===emd;}):apts;
  filtered=filtered.sort(function(a,b){return (a.name||'').localeCompare(b.name||'','ko');});
  if(!filtered.length){el.innerHTML='<div style="padding:12px;font-size:12px;color:#718096">해당 지역 단지 없음</div>';return;}
  var codes=filtered.map(function(a){return a.code;}).filter(Boolean);
  var brokerMap=await fetchAptBrokerMap(codes);
  el.innerHTML=filtered.map(function(a){
    var already=specialistApts.find(function(x){return x.kapt_code===a.code;});
    return aptListItemHtml(a, already, brokerMap[a.code]||[]);
  }).join('');
}

  el.innerHTML=results.map(function(a){
    var already=specialistApts.find(function(x){return x.kapt_code===a.code;});

// 단지 코드 목록의 등록 중개사를 한 번에 조회 → {kapt_code: [{name, expires_at}]} 반환
async function fetchAptBrokerMap(codes){
  var map={};
  if(!codes||!codes.length)return map;
  var today=new Date().toISOString().split('T')[0];
  try{
    var inList=codes.slice(0,100).map(function(c){return encodeURIComponent(c);}).join(',');
    var rows=await fetch(
      SUPABASE_URL+'/rest/v1/broker_apts?kapt_code=in.('+inList+')&active=eq.true&expires_at=gte.'+today+'&select=kapt_code,expires_at,brokers(name)',
      {headers:hdrs}
    ).then(function(r){return r.json();});
    if(Array.isArray(rows)){
      rows.forEach(function(r){
        if(!map[r.kapt_code])map[r.kapt_code]=[];
        var bname=(r.brokers&&r.brokers.name)||'?';
        map[r.kapt_code].push({name:bname,expires_at:r.expires_at});
      });
    }
  }catch(e){}
  return map;
}

// 단지 목록 아이템 HTML 생성 (등록 중개사 포함)
function aptListItemHtml(a, already, brokers){
  var brokersHtml='';
  if(brokers&&brokers.length){
    var isFull=brokers.length>=2;
    brokersHtml='<div style="font-size:10px;margin-top:2px;color:'+(isFull?'#fc8181':'#68d391')+'">'
      +'👤 '+(brokers.map(function(b){return b.name;}).join(', '))
      +' ('+brokers.length+'/2'+(isFull?' · 마감':'')+')'
      +'</div>';
  }
  return '<div class="apt-list-item" style="flex-direction:column;align-items:flex-start;gap:2px">'
    +'<div style="display:flex;width:100%;justify-content:space-between;align-items:center">'
      +'<span>'+a.name+'<small>'+(a.emd||a.addr||'').substring(0,28)+'</small></span>'
      +(already
        ? '<span style="font-size:11px;color:#9ae6b4">✓추가됨</span>'
        : '<button class="apt-add-btn" onclick="addSpecialistApt(\''+escQ(a.code)+'\',\''+escQ(a.name)+'\',\''+escQ(a.addr||'')+'\')">+ 추가</button>'
      )
    +'</div>'
    +brokersHtml
    +'</div>';
}

async function addSpecialistApt(code,name,addr){
  if(specialistApts.find(function(a){return a.kapt_code===code;})){toast('이미 추가된 단지입니다',true);return;}
  // 해당 단지의 현재 활성 전문중개사 수 확인 (현재 편집 중인 중개사 제외)
  try{
    var today=new Date().toISOString().split('T')[0];
    var url=SUPABASE_URL+'/rest/v1/broker_apts?kapt_code=eq.'+encodeURIComponent(code)+'&active=eq.true&expires_at=gte.'+today+'&select=broker_id';
    var rows=await fetch(url,{headers:hdrs}).then(function(r){return r.json();});
    if(Array.isArray(rows)){
      // 현재 편집 중인 중개사는 카운트 제외 (이미 이 단지에 등록되어 있을 수 있음)
      var others=rows.filter(function(r){return !brokerEditId||r.broker_id!==brokerEditId;});
      if(others.length>=2){toast('이 단지는 전문중개사 2자리가 모두 찼습니다',true);return;}
    }
  }catch(e){/* 네트워크 오류 시 그냥 통과 */}
  var today2=new Date().toISOString().split('T')[0];
  var exp=new Date();exp.setFullYear(exp.getFullYear()+1);
  var expiresAt=exp.toISOString().split('T')[0];
  specialistApts.push({kapt_code:code,name:name,addr:addr,start_date:today2,expires_at:expiresAt,active:true});
  renderAptTags();
  // 목록 새로고침 (추가됨 표시)
  var sido=ge('b-sido').value,sg=ge('b-sigungu').value,emd=ge('b-emd').value;
  if(sido&&sg)loadAptsBySigungu(sido,sg,emd);
  if(ge('b-apt-name-list').style.display!=='none')doAptSearch();
}
function removeSpecialistApt(code){
  specialistApts=specialistApts.filter(function(a){return a.kapt_code!==code;});
  renderAptTags();
}
function renderAptTags(){
  var el=ge('b-apt-tags');
  if(!specialistApts.length){el.innerHTML='<span style="font-size:11px;color:#718096">담당 단지를 추가하세요 (없으면 단지 미지정으로 가입)</span>';return;}
  el.innerHTML=specialistApts.map(function(a){
    var dateStr=a.start_date?'<span style="font-size:10px;color:#a0aec0;margin-left:4px">'+a.start_date+'</span>':'';
    return '<span class="apt-tag">'+a.name+dateStr+' <span class="x" onclick="removeSpecialistApt(\''+escQ(a.kapt_code)+'\')">✕</span></span>';
  }).join('');
}

  var name=gv('bn-name');if(!name){toast('업체명을 입력하세요',true);return;}
  if(!bannerImg){toast('배너 이미지를 선택하세요',true);return;}
  if(!bannerAreas.length){toast('대상 지역을 1개 이상 추가하세요',true);return;}
  // 각 지역별 6명 제한 체크
  try{
    var today=new Date().toISOString().split('T')[0];
    var allActive=await fetch(SUPABASE_URL+'/rest/v1/banners?select=id,business_name,areas,expires_at,active&active=eq.true',{headers:hdrs}).then(function(r){return r.json();});
    for(var i=0;i<bannerAreas.length;i++){
      var a=bannerAreas[i];
      var matched=allActive.filter(function(b){
        if(b.expires_at&&b.expires_at<today)return false;
        if(bannerEditId&&b.id===bannerEditId)return false; // 수정 시 자기 제외
        return Array.isArray(b.areas)&&b.areas.some(function(x){return x.sido===a.sido&&x.sigungu===a.sigungu&&x.emd===a.emd;});
      });
      if(matched.length>=BANNER_MAX){toast(a.emd+' 지역은 배너가 '+BANNER_MAX+'개 꽉 찼습니다',true);return;}
    }
  }catch(e){}
  var areas=bannerAreas.map(function(a){return {sido:a.sido,sigungu:a.sigungu,emd:a.emd};});
  var body={business_name:name,category:getBnCategory(),phone:gv('bn-phone'),image:bannerImg,areas:areas,expires_at:gv('bn-expires')||null,active:true};
  if(bannerEditId){
    var r=await fetch(SUPABASE_URL+'/rest/v1/banners?id=eq.'+bannerEditId,{method:'PATCH',headers:hdrs,body:JSON.stringify(body)});
    if(r.ok){toast('수정 완료!');bannerCancel();loadBanners();bnEmdChange();}else toast('실패',true);
  }else{
    var r=await fetch(SUPABASE_URL+'/rest/v1/banners',{method:'POST',headers:hdrs,body:JSON.stringify(body)});
    if(r.ok){toast('등록 완료!');bannerCancel();loadBanners();bnEmdChange();}else toast('실패',true);
  }
}
async function bannerToggle(id,cur){
  await fetch(SUPABASE_URL+'/rest/v1/banners?id=eq.'+id,{method:'PATCH',headers:hdrs,body:JSON.stringify({active:!cur})});
  toast(cur?'비활성화':'활성화');loadBanners();
}
async function bannerDelete(id,name){
  if(!confirm('"'+name+'" 배너 삭제할까요?'))return;
  await fetch(SUPABASE_URL+'/rest/v1/banners?id=eq.'+id,{method:'DELETE',headers:hdrs});
  toast('삭제 완료');loadBanners();
}
async function bannerDeleteArea(id,name){
  if(!confirm('"'+name+'" 배너 삭제할까요?'))return;
  await fetch(SUPABASE_URL+'/rest/v1/banners?id=eq.'+id,{method:'DELETE',headers:hdrs});
  toast('삭제 완료');bnEmdChange();
}
</script>
