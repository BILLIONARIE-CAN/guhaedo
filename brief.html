<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>아구구 매물안내서</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--green:#1D9E75;--green-d:#157a5a;--bg:#f4f6f8;--line:#e6e9ec;--t1:#1a1a1a;--t2:#555;--t3:#8a9199}
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{margin:0;font-family:'Malgun Gothic','맑은 고딕',-apple-system,sans-serif;background:var(--bg);color:var(--t1);line-height:1.5}
  .bar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center;z-index:10;flex-wrap:wrap}
  .bar input{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px}
  .bar button{padding:9px 16px;border:0;border-radius:8px;background:var(--green);color:#fff;font-weight:700;cursor:pointer;font-size:14px}
  .bar .sec{background:#eef4f1;color:var(--green-d)}
  #results{position:absolute;top:52px;left:16px;right:16px;max-width:520px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.1);max-height:320px;overflow:auto;z-index:20}
  #results div{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
  #results div:hover{background:#f4faf7}
  #results small{color:var(--t3);margin-left:6px}
  .page{max-width:800px;margin:18px auto;background:#fff;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.06);padding:28px 32px}
  .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--green);padding-bottom:12px;margin-bottom:16px}
  .hd h1{margin:0;font-size:26px}
  .hd .addr{color:var(--t2);font-size:13px;margin-top:4px}
  .hd .brand{color:var(--green);font-weight:800;font-size:15px}
  .sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
  .sum .c{background:var(--bg);border-radius:8px;padding:12px;text-align:center}
  .sum .c .l{font-size:11px;color:var(--t3)}
  .sum .c .v{font-size:19px;font-weight:800;margin-top:3px;color:var(--green-d)}
  .sum .c .v small{font-size:12px;color:var(--t2);font-weight:600}
  h3{font-size:15px;margin:22px 0 8px;padding-left:9px;border-left:4px solid var(--green)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  .info td{padding:7px 10px;border:1px solid var(--line)}
  .info td.k{background:#fafbfc;color:var(--t2);width:110px;font-weight:600}
  .deals th,.deals td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;font-size:12.5px}
  .deals th{background:#fafbfc;color:var(--t2)}
  .chartbox{height:230px;margin-top:6px}
  .broker{margin-top:24px;border-top:2px dashed var(--line);padding-top:14px}
  .broker .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .broker input{flex:1;min-width:140px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px}
  .bcard{display:none;background:#f4faf7;border:1px solid #cfe9df;border-radius:8px;padding:14px 16px;margin-top:6px}
  .bcard .nm{font-size:17px;font-weight:800;color:var(--green-d)}
  .bcard .li{font-size:13px;color:var(--t2);margin-top:3px}
  .foot{margin-top:18px;color:var(--t3);font-size:11px;text-align:center;border-top:1px solid var(--line);padding-top:10px}
  .empty{max-width:800px;margin:60px auto;text-align:center;color:var(--t3)}
  @media print{
    .bar,#results,.noprint{display:none!important}
    body{background:#fff}
    .page{box-shadow:none;margin:0;max-width:100%;padding:0}
    .broker input{border:0;padding:0}
    .bcard{display:block!important}
    .broker .edit{display:none!important}
  }
</style>
</head>
<body>
<div class="bar">
  <input id="q" placeholder="단지명 검색 (예: 래미안, 자이…)" autocomplete="off">
  <button onclick="doSearch()">검색</button>
  <button class="sec" onclick="window.print()">🖨 인쇄 / PDF</button>
</div>
<div id="results" style="display:none"></div>
<div id="empty" class="empty">위에서 단지를 검색해 안내서를 만들어보세요.<br><small>아구구 데이터(실거래·관리비·시세) 기반 매물안내서</small></div>
<div id="page" style="display:none"></div>

<script>
const SUPABASE_URL='https://nqnbbccazjanjhktknyz.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xbmJiY2Nhemphbmpoa3Rrbnl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0OTA5NDQsImV4cCI6MjA5NTA2Njk0NH0.rT_hIwTJyBnCDGyudmJYvN44G67WgZ9-bSVCzShiRjI';
const H={apikey:SUPABASE_ANON,Authorization:'Bearer '+SUPABASE_ANON};
const ge=id=>document.getElementById(id);
const won=v=>{ v=parseInt(v)||0; if(v>=10000){var e=Math.floor(v/10000),m=v%10000; return e+'억'+(m?' '+m.toLocaleString():'');} return v.toLocaleString(); };
let chart=null;

async function doSearch(){
  const q=ge('q').value.trim(); if(q.length<2){alert('두 글자 이상 입력하세요');return;}
  const r=await fetch(SUPABASE_URL+'/rest/v1/apt_metrics?select=kapt_code,name,dong,units,price_m&name=ilike.*'+encodeURIComponent(q)+'*&order=price_m.desc.nullslast&limit=25',{headers:H});
  const rows=await r.json();
  const box=ge('results');
  if(!rows.length){ box.style.display='none'; alert('검색 결과가 없어요'); return; }
  box.innerHTML=rows.map(x=>`<div onclick="pick('${x.kapt_code}')">${x.name||'(이름없음)'}<small>${x.units?x.units+'세대':''} ${x.price_m?'· 최근 '+won(x.price_m):''}</small></div>`).join('');
  box.style.display='block';
}
ge('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});

async function pick(code){
  ge('results').style.display='none'; ge('empty').style.display='none';
  ge('page').style.display='block'; ge('page').innerHTML='<div class="page">불러오는 중…</div>';
  // 1) 기본+시세
  const m=(await (await fetch(SUPABASE_URL+'/rest/v1/apt_metrics?kapt_code=eq.'+code+'&select=*',{headers:H})).json())[0]||{};
  // 2) 실거래 (최근 24개월)
  const yms=[]; const now=new Date(); for(let i=0;i<24;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1); yms.push(''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0'));}
  let trade={buy:[],jeonse:[],monthly:[]};
  try{ trade=await (await fetch('/api/trade?code='+code+'&yms='+yms.join(','))).json()||trade; }catch(e){}
  // 3) 관리비
  let mgmt=null; try{ mgmt=await (await fetch('/api/apt?type=mgmtcost&code='+code+'&units='+(parseInt(m.units)||0))).json(); }catch(e){}
  render(code,m,trade,mgmt);
}

function render(code,m,trade,mgmt){
  const py = m.rep_area_m2 ? Math.round(m.rep_area_m2/0.75/3.3058) : null;
  const addr = [trade.legalDong, trade.jibunFull].filter(Boolean).join(' ');
  const buy=(trade.buy||[]), jeonse=(trade.jeonse||[]);
  // 월별 평균
  function byMonth(arr){ const g={}; arr.forEach(x=>{ if(!x.p)return; (g[x.t]=g[x.t]||[]).push(x.p); }); return Object.keys(g).sort().map(t=>({t,v:Math.round(g[t].reduce((a,b)=>a+b,0)/g[t].length)})); }
  const bm=byMonth(buy), jm=byMonth(jeonse);
  const labels=[...new Set([...bm.map(x=>x.t),...jm.map(x=>x.t)])].sort();
  // 최근 실거래 5건
  const recent=buy.slice().sort((a,b)=>(b.t+String(b.day).padStart(2,'0')).localeCompare(a.t+String(a.day).padStart(2,'0'))).slice(0,6);
  const bi=JSON.parse(localStorage.getItem('brief_broker')||'{}');
  const html=`<div class="page">
    <div class="hd"><div><h1>${m.name||''}</h1><div class="addr">${addr}</div></div><div class="brand">아구구 매물안내서</div></div>
    <div class="sum">
      <div class="c"><div class="l">최근 매매 실거래</div><div class="v">${m.price_m?won(m.price_m):'-'}</div></div>
      <div class="c"><div class="l">평당가</div><div class="v">${m.py_m?m.py_m.toLocaleString()+'<small>만/평</small>':'-'}</div></div>
      <div class="c"><div class="l">전세가</div><div class="v">${m.jeonse_m?won(m.jeonse_m):'-'}</div></div>
      <div class="c"><div class="l">전세가율 / 갭</div><div class="v">${m.j_rate?m.j_rate+'%':'-'}<small>${m.gap_m?' / '+won(m.gap_m):''}</small></div></div>
    </div>
    <h3>단지 정보</h3>
    <table class="info"><tbody>
      <tr><td class="k">세대수</td><td>${m.units?m.units+'세대':'-'}</td><td class="k">입주</td><td>${m.movein?m.movein+'년':'-'}</td></tr>
      <tr><td class="k">대표평형</td><td>${py?('약 '+py+'평 (공급) / 전용 '+Math.round(m.rep_area_m2)+'㎡'):'-'}</td><td class="k">최근1.5년 거래</td><td>${m.deal_cnt?m.deal_cnt+'건':'-'}</td></tr>
      <tr><td class="k">월 관리비</td><td colspan="3">${mgmt&&mgmt.perHousehold?(mgmt.perHousehold.toLocaleString()+'원 / 세대 (공용, '+(mgmt.ym||'')+' 기준)'):'집계중'}</td></tr>
    </tbody></table>
    <h3>실거래가 추이 (최근 2년)</h3>
    <div class="chartbox"><canvas id="cv"></canvas></div>
    <h3>최근 매매 실거래</h3>
    <table class="deals"><thead><tr><th>거래월</th><th>전용면적</th><th>층</th><th>거래가</th></tr></thead><tbody>
      ${recent.length?recent.map(x=>`<tr><td>${x.t}</td><td>${x.a?x.a+'㎡':'-'}</td><td>${x.f||'-'}</td><td>${won(x.p)}</td></tr>`).join(''):'<tr><td colspan="4" style="color:#999;padding:14px">최근 실거래 없음</td></tr>'}
    </tbody></table>
    <div class="broker">
      <div class="edit noprint">
        <div style="font-size:12px;color:var(--t3);margin-bottom:6px">아래 정보는 인쇄 시 안내서 하단에 표시됩니다 (한 번 입력하면 저장돼요)</div>
        <div class="row"><input id="b_office" placeholder="부동산 사무소명" value="${bi.office||''}"><input id="b_name" placeholder="담당 공인중개사" value="${bi.name||''}"></div>
        <div class="row"><input id="b_tel" placeholder="연락처" value="${bi.tel||''}"><input id="b_addr" placeholder="사무소 주소(선택)" value="${bi.addr||''}"></div>
        <button onclick="saveBroker()" style="padding:8px 14px;border:0;border-radius:6px;background:var(--green);color:#fff;font-weight:700;cursor:pointer">저장 후 미리보기</button>
      </div>
      <div class="bcard" id="bcard">
        <div class="nm">${bi.office||'○○ 공인중개사'}</div>
        <div class="li">담당: ${bi.name||'-'} · 연락처: <b>${bi.tel||'-'}</b></div>
        ${bi.addr?`<div class="li">${bi.addr}</div>`:''}
      </div>
    </div>
    <div class="foot">본 안내서의 실거래·시세·관리비 데이터는 국토교통부·공동주택관리정보시스템 공개자료 기반이며 참고용입니다. · 아구구(a99.co.kr)</div>
  </div>`;
  ge('page').innerHTML=html;
  // 차트
  if(chart)chart.destroy();
  chart=new Chart(ge('cv'),{type:'line',data:{labels,datasets:[
    {label:'매매',data:labels.map(t=>{const f=bm.find(x=>x.t===t);return f?f.v:null;}),borderColor:'#1D9E75',backgroundColor:'#1D9E7522',spanGaps:true,tension:.3},
    {label:'전세',data:labels.map(t=>{const f=jm.find(x=>x.t===t);return f?f.v:null;}),borderColor:'#e67e22',backgroundColor:'#e67e2222',spanGaps:true,tension:.3}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top'}},scales:{y:{ticks:{callback:v=>won(v)}}}}});
}
function saveBroker(){
  const bi={office:ge('b_office').value,name:ge('b_name').value,tel:ge('b_tel').value,addr:ge('b_addr').value};
  localStorage.setItem('brief_broker',JSON.stringify(bi));
  const c=ge('bcard'); c.style.display='block';
  c.innerHTML=`<div class="nm">${bi.office||'○○ 공인중개사'}</div><div class="li">담당: ${bi.name||'-'} · 연락처: <b>${bi.tel||'-'}</b></div>${bi.addr?`<div class="li">${bi.addr}</div>`:''}`;
  alert('저장됐어요. 인쇄하면 하단에 표시됩니다.');
}
// URL ?code= 지원
const u=new URLSearchParams(location.search); if(u.get('code')) pick(u.get('code'));
</script>
</body>
</html>
