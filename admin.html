<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아구구 관리자</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Apple SD Gothic Neo',sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh}
  .header{background:#1a1f2e;border-bottom:1px solid #2d3748;padding:16px 24px;display:flex;align-items:center;gap:12px}
  .header h1{font-size:18px;font-weight:700;color:#fff}
  .header span{font-size:12px;color:#718096;background:#2d3748;padding:3px 8px;border-radius:4px}
  .login-wrap{max-width:360px;margin:80px auto;padding:32px;background:#1a1f2e;border-radius:12px;border:1px solid #2d3748}
  .login-wrap h2{font-size:20px;font-weight:700;margin-bottom:24px;text-align:center}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;color:#a0aec0;margin-bottom:6px}
  .field input{width:100%;padding:10px 12px;background:#2d3748;border:1px solid #4a5568;border-radius:8px;color:#fff;font-size:14px;outline:none}
  .field input:focus{border-color:#48bb78}
  .btn{width:100%;padding:12px;background:#48bb78;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
  .btn:hover{background:#38a169}
  .btn-sm{padding:6px 14px;font-size:12px;font-weight:600;border:none;border-radius:6px;cursor:pointer}
  .btn-red{background:#e53e3e;color:#fff}
  .btn-red:hover{background:#c53030}
  .btn-gray{background:#4a5568;color:#fff}
  .btn-gray:hover{background:#2d3748}
  .container{max-width:900px;margin:32px auto;padding:0 24px}
  .card{background:#1a1f2e;border-radius:12px;border:1px solid #2d3748;padding:24px;margin-bottom:24px}
  .card-title{font-size:16px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:8px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form-grid .full{grid-column:1/-1}
  .input{width:100%;padding:9px 12px;background:#2d3748;border:1px solid #4a5568;border-radius:8px;color:#fff;font-size:13px;outline:none}
  .input:focus{border-color:#48bb78}
  .btn-green{background:#48bb78;color:#fff;padding:10px 20px;font-size:13px;font-weight:700;border:none;border-radius:8px;cursor:pointer}
  .btn-green:hover{background:#38a169}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;color:#718096;font-weight:600;padding:8px 12px;border-bottom:1px solid #2d3748;text-transform:uppercase}
  td{padding:12px;font-size:13px;border-bottom:1px solid #1e2533;vertical-align:middle}
  tr:hover td{background:#1e2533}
  .badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
  .badge-on{background:#276749;color:#9ae6b4}
  .badge-off{background:#742a2a;color:#feb2b2}
  .photo-preview{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #4a5568}
  .empty{text-align:center;padding:40px;color:#718096;font-size:14px}
  .toast{position:fixed;bottom:24px;right:24px;background:#276749;color:#9ae6b4;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .3s;z-index:999}
  .toast.show{opacity:1}
  .section-divider{display:flex;align-items:center;gap:12px;margin:8px 0 20px}
  .section-divider span{font-size:13px;color:#718096;white-space:nowrap}
  .section-divider::before,.section-divider::after{content:'';flex:1;height:1px;background:#2d3748}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login-page">
  <div style="text-align:center;padding:40px 0 0">
    <div style="font-size:28px;font-weight:900;color:#48bb78">아구구</div>
    <div style="font-size:12px;color:#718096;margin-top:4px">관리자 페이지</div>
  </div>
  <div class="login-wrap">
    <h2>🔐 관리자 로그인</h2>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="pw-input" placeholder="관리자 비밀번호 입력" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn" onclick="doLogin()">로그인</button>
    <div id="login-err" style="color:#fc8181;font-size:12px;margin-top:10px;text-align:center"></div>
  </div>
</div>

<!-- 메인 -->
<div id="main-page" style="display:none">
  <div class="header">
    <div style="font-size:20px">🏠</div>
    <h1>아구구 관리자</h1>
    <span>brokers</span>
    <div style="margin-left:auto;display:flex;gap:8px">
      <a href="https://guhaedo.kr" target="_blank" style="color:#48bb78;font-size:12px;text-decoration:none">사이트 보기 →</a>
      <button class="btn-sm btn-gray" onclick="logout()">로그아웃</button>
    </div>
  </div>

  <div class="container">
    <!-- 중개사 추가 -->
    <div class="card">
      <div class="card-title">➕ 중개사 추가</div>
      <div class="form-grid">
        <div>
          <div style="font-size:12px;color:#a0aec0;margin-bottom:6px">사무소명 *</div>
          <input class="input" id="f-name" placeholder="예: (힐스자이단지내)구해줘부동산중개">
        </div>
        <div>
          <div style="font-size:12px;color:#a0aec0;margin-bottom:6px">연락처</div>
          <input class="input" id="f-phone" placeholder="010-0000-0000">
        </div>
        <div class="full">
          <div style="font-size:12px;color:#a0aec0;margin-bottom:6px">주소</div>
          <input class="input" id="f-addr" placeholder="충남 아산시 동방로 169, 근린생활시설 106호">
        </div>
        <div>
          <div style="font-size:12px;color:#a0aec0;margin-bottom:6px">위도 (lat)</div>
          <input class="input" id="f-lat" placeholder="36.7782" type="number" step="0.0001">
        </div>
        <div>
          <div style="font-size:12px;color:#a0aec0;margin-bottom:6px">경도 (lng)</div>
          <input class="input" id="f-lng" placeholder="127.0952" type="number" step="0.0001">
        </div>
        <div class="full">
          <div style="font-size:12px;color:#a0aec0;margin-bottom:6px">프로필 사진 URL (선택)</div>
          <input class="input" id="f-photo" placeholder="https://...">
        </div>
      </div>
      <div style="margin-top:16px;display:flex;gap:8px;align-items:center">
        <button class="btn-green" onclick="addBroker()">등록하기</button>
        <span style="font-size:12px;color:#718096">* 위도/경도는 카카오맵에서 확인 가능</span>
      </div>
    </div>

    <!-- 중개사 목록 -->
    <div class="card">
      <div class="card-title">👥 등록된 중개사 <span id="broker-count" style="font-size:13px;color:#718096;font-weight:400"></span></div>
      <div id="broker-list">
        <div class="empty">불러오는 중...</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://nqnbbccazjanjhktknyz.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5xbmJiY2Nhemphbmpoa3Rrbnl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0OTA5NDQsImV4cCI6MjA5NTA2Njk0NH0.rT_hIwTJyBnCDGyudmJYvN44G67WgZ9-bSVCzShiRjI';
const ADMIN_PW = 'guhaedo2024!'; // 변경 가능

function doLogin(){
  const pw = document.getElementById('pw-input').value;
  if(pw === ADMIN_PW){
    document.getElementById('login-page').style.display='none';
    document.getElementById('main-page').style.display='block';
    loadBrokers();
  } else {
    document.getElementById('login-err').textContent='비밀번호가 틀렸습니다.';
  }
}

function logout(){
  document.getElementById('login-page').style.display='block';
  document.getElementById('main-page').style.display='none';
  document.getElementById('pw-input').value='';
}

function showToast(msg, isErr=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isErr ? '#742a2a' : '#276749';
  t.style.color = isErr ? '#feb2b2' : '#9ae6b4';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

const headers = {
  'Content-Type': 'application/json',
  apikey: SUPABASE_ANON,
  Authorization: `Bearer ${SUPABASE_ANON}`,
  Prefer: 'return=representation'
};

async function loadBrokers(){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/brokers?select=*&order=created_at.desc`, {headers});
  const data = await r.json();
  const el = document.getElementById('broker-list');
  document.getElementById('broker-count').textContent = `(${data.length}명)`;
  if(!data.length){ el.innerHTML='<div class="empty">등록된 중개사가 없습니다</div>'; return; }
  el.innerHTML = `<table>
    <tr><th>사진</th><th>사무소명</th><th>연락처</th><th>주소</th><th>좌표</th><th>상태</th><th>관리</th></tr>
    ${data.map(d=>`<tr>
      <td>${d.photo?`<img class="photo-preview" src="${d.photo}" onerror="this.style.display='none'">`:'<div style="width:36px;height:36px;border-radius:50%;background:#2d3748;display:flex;align-items:center;justify-content:center;font-size:16px">🏠</div>'}</td>
      <td style="font-weight:600">${d.name}</td>
      <td style="color:#a0aec0">${d.phone||'-'}</td>
      <td style="color:#a0aec0;font-size:12px">${d.addr||'-'}</td>
      <td style="color:#718096;font-size:11px">${d.lat},${d.lng}</td>
      <td><span class="badge ${d.active?'badge-on':'badge-off'}">${d.active?'활성':'비활성'}</span></td>
      <td style="display:flex;gap:6px">
        <button class="btn-sm btn-gray" onclick="toggleActive('${d.id}',${d.active})">${d.active?'비활성화':'활성화'}</button>
        <button class="btn-sm btn-red" onclick="deleteBroker('${d.id}','${d.name}')">삭제</button>
      </td>
    </tr>`).join('')}
  </table>`;
}

async function addBroker(){
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const addr = document.getElementById('f-addr').value.trim();
  const lat = parseFloat(document.getElementById('f-lat').value);
  const lng = parseFloat(document.getElementById('f-lng').value);
  const photo = document.getElementById('f-photo').value.trim();
  if(!name||!lat||!lng){ showToast('사무소명, 위도, 경도는 필수입니다', true); return; }
  const r = await fetch(`${SUPABASE_URL}/rest/v1/brokers`, {
    method:'POST', headers,
    body: JSON.stringify({name, phone, addr, lat, lng, photo, active:true})
  });
  if(r.ok){
    showToast('✅ 등록 완료!');
    ['f-name','f-phone','f-addr','f-lat','f-lng','f-photo'].forEach(id=>document.getElementById(id).value='');
    loadBrokers();
  } else { showToast('등록 실패', true); }
}

async function toggleActive(id, current){
  await fetch(`${SUPABASE_URL}/rest/v1/brokers?id=eq.${id}`, {
    method:'PATCH', headers,
    body: JSON.stringify({active: !current})
  });
  showToast(current ? '비활성화했어요' : '활성화했어요');
  loadBrokers();
}

async function deleteBroker(id, name){
  if(!confirm(`"${name}" 삭제할까요?`)) return;
  await fetch(`${SUPABASE_URL}/rest/v1/brokers?id=eq.${id}`, {method:'DELETE', headers});
  showToast('삭제했어요');
  loadBrokers();
}
</script>
</body>
</html>
